[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-google-sheets"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "open-table-connector-contract>=0.1,<0.2",
  "polars>=1,<2",
  "pyarrow>=14,<24",
]

[project.entry-points."open_table_connector.providers"]
google_sheets = "open_table_connector.google_sheets.plugin:provider_plugin"

[project.entry-points."open_table_connector.cli_adapters"]
google_sheets = "open_table_connector.google_sheets.plugin:provider_plugin"

[tool.uv.sources]
open-table-connector-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.google_sheets*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.google_sheets" = ["manifest.json", "py.typed"]
