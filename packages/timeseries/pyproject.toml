[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-timeseries"
version = "0.1.0"
description = "Portable temporal plans and execution contracts for Open Table Connector"
requires-python = ">=3.11"
dependencies = [
  "open-table-connector-contract==0.1.0",
  "polars>=1.0,<2",
  "pyarrow>=14,<20",
]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.timeseries*"]
namespaces = true
