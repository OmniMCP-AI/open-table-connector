[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-local-files"
version = "0.1.0"
description = "Neutral CSV, Excel, and Markdown Connectors with a local-files compatibility facade"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "open-table-connector-contract>=0.1,<0.2",
  "open-table-connector-timeseries>=0.1,<0.2",
  "openpyxl>=3.1,<4",
  "polars>=1,<2",
  "pyarrow>=14,<20",
]

[project.entry-points."open_table_connector.process_handlers"]
csv = "open_table_connector.local_files.plugin:csv_process_plugin"
json = "open_table_connector.local_files.plugin:json_process_plugin"
jsonl = "open_table_connector.local_files.plugin:json_process_plugin"
excel = "open_table_connector.local_files.plugin:excel_process_plugin"

[project.entry-points."open_table_connector.providers"]
local_files = "open_table_connector.local_files.plugin:provider_plugin"

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-timeseries = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.local_files*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.local_files" = ["py.typed"]
