[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-connectors-local-files"
version = "0.2.0"
description = "Neutral local CSV and Excel Connector"
requires-python = ">=3.11"
dependencies = [
  "open-connectors-contract==0.2.0",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "polars>=1.0,<2",
  "pyarrow>=14,<20",
]

[tool.uv.sources]
open-connectors-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_connectors.local_files*"]
namespaces = true
