[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contract", "packages/conformance", "packages/timeseries", "packages/process", "packages/local_files", "packages/postgres", "packages/sqlite", "packages/dbt", "packages/maybe_sheet", "packages/google_sheets", "packages/feishu_bitable", "packages/cli"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.otc.support]
python = ">=3.11,<3.15"
pyarrow = ">=14,<20"
polars = ">=1,<2"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
