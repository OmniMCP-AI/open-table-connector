[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-timeseries"
version = "0.1.0"
description = "Portable temporal plans and execution contracts for Open Table Connector"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "open-table-connector-contract>=0.1,<0.2",
  "polars>=1,<2",
  "pyarrow>=14,<24",
]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.timeseries*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.timeseries" = ["py.typed"]
