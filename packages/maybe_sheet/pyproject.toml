[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-maybe-sheet"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = ["open-table-connector-contract>=0.1,<0.2", "open-table-connector-timeseries>=0.1,<0.2", "polars>=1,<2", "pyarrow>=14,<24"]

[project.entry-points."open_table_connector.process_handlers"]
maybe_sheet = "open_table_connector.maybe_sheet.plugin:process_plugin"

[project.entry-points."open_table_connector.providers"]
maybe_sheet = "open_table_connector.maybe_sheet.plugin:provider_plugin"

[project.entry-points."open_table_connector.cli_adapters"]
maybe_sheet = "open_table_connector.maybe_sheet.plugin:provider_plugin"

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-timeseries = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.maybe_sheet*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.maybe_sheet" = ["py.typed"]
