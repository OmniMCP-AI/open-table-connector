[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-officecli"
version = "0.1.0"
description = "Optional OfficeCLI artifact adapter"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
dependencies = ["open-table-connector-artifacts>=0.1,<0.2"]

[tool.uv.sources]
open-table-connector-artifacts = { workspace = true }

[project.entry-points."open_table_connector.artifact_adapters.v1"]
officecli = "open_table_connector.officecli.plugin:artifact_adapter"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.officecli*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.officecli" = ["py.typed"]
