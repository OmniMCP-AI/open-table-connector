[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-feishu-bitable"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "open-table-connector-contract>=0.1,<0.2",
  "open-table-connector-formulas>=0.1,<0.2",
  "polars>=1,<2",
  "pyarrow>=14,<24",
]

[project.entry-points."open_table_connector.providers"]
feishu_bitable = "open_table_connector.feishu_bitable.plugin:provider_plugin"

[project.entry-points."open_table_connector.cli_adapters"]
feishu_bitable = "open_table_connector.feishu_bitable.plugin:provider_plugin"

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-formulas = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.feishu_bitable*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.feishu_bitable" = ["manifest.json", "py.typed"]
