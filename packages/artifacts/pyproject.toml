[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-artifacts"
version = "0.1.0"
description = "Neutral document artifact contracts for Open Table Connector"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
dependencies = ["open-table-connector-contract>=0.1,<0.2"]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.artifacts*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.artifacts" = ["py.typed", "schemas/*.json"]
