[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-maybe-sheet"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
dependencies = ["open-table-connector-contract>=0.1,<0.2", "open-table-connector-timeseries>=0.1,<0.2", "polars>=1,<2", "pyarrow>=14,<20"]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-timeseries = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.maybe_sheet*"]
namespaces = true
