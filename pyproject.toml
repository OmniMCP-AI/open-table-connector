[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-workspace"
version = "0.1.0"
description = "Framework-neutral physical data Connectors"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/contract", "packages/conformance", "packages/local_files", "packages/postgres", "packages/sqlite", "packages/dbt", "packages/maybe_sheet", "packages/google_sheets", "packages/feishu_bitable", "packages/cli"]

[dependency-groups]
dev = ["pytest>=9,<10", "xlwt>=1.3,<2"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
