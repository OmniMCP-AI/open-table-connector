[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-connectors-feishu-bitable"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_connectors.feishu_bitable*"]
namespaces = true

[tool.setuptools.package-data]
"open_connectors.feishu_bitable" = ["manifest.json"]
