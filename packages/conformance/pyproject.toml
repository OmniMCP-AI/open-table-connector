[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-conformance"
version = "0.1.0"
description = "Reusable conformance tests for neutral Connectors"
requires-python = ">=3.11"
dependencies = [
  "open-table-connector-contract==0.2.0",
]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.conformance*"]
namespaces = true
