[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-connectors-postgres"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["open-connectors-contract==0.2.0", "polars>=1.0,<2", "pyarrow>=14,<20"]

[tool.uv.sources]
open-connectors-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_connectors.postgres*"]
namespaces = true
