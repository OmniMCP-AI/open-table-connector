[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-process"
version = "0.1.0"
description = "Local framed connector supervisor for Open Table Connector"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "open-table-connector-contract>=0.1,<0.2",
  "open-table-connector-timeseries>=0.1,<0.2",
  "open-table-connector-local-files>=0.1,<0.2",
  "open-table-connector-maybe-sheet>=0.1,<0.2",
  "open-table-connector-postgres>=0.1,<0.2",
  "open-table-connector-sqlite>=0.1,<0.2",
  "pyarrow>=14,<20",
]

[project.scripts]
otc-process = "open_table_connector.process.__main__:main"

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-timeseries = { workspace = true }
open-table-connector-local-files = { workspace = true }
open-table-connector-maybe-sheet = { workspace = true }
open-table-connector-postgres = { workspace = true }
open-table-connector-sqlite = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.process*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.process" = ["py.typed"]
