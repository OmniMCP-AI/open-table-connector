[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector"
version = "0.1.0"
description = "Open Table Connector CLI"
requires-python = ">=3.11"
dependencies = [
  "open-connectors-contract==0.1.0",
]

[project.scripts]
otc = "open_connectors.cli.__main__:main"
open-table-connector = "open_connectors.cli.__main__:main"
open-connectors = "open_connectors.cli.__main__:main"

[tool.uv.sources]
open-connectors-contract = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_connectors.cli*"]
namespaces = true
