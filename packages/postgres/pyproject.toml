[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-postgres"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["open-table-connector-contract==0.1.0", "open-table-connector-timeseries==0.1.0", "polars>=1.0,<2", "pyarrow>=14,<20"]

[project.optional-dependencies]
live = ["psycopg2-binary>=2.9,<3"]

[tool.uv.sources]
open-table-connector-contract = { workspace = true }
open-table-connector-timeseries = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.postgres*"]
namespaces = true
