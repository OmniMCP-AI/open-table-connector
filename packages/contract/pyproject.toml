[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-connectors-contract"
version = "0.2.0"
description = "Framework-neutral Connector contract v2"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "polars>=1.0,<2",
  "pyarrow>=14,<20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_connectors.contract*"]
namespaces = true
