[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-table-connector-contract"
version = "0.1.0"
description = "Framework-neutral Connector contract v1"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "jsonschema>=4.23,<5",
  "polars>=1,<2",
  "pyarrow>=14,<24",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_table_connector.contract*"]
namespaces = true

[tool.setuptools.package-data]
"open_table_connector.contract" = ["py.typed"]
